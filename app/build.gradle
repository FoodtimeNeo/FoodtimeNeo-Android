import java.net.URI

plugins {
    id 'com.android.application'
}

def releaseStorePath = providers.gradleProperty('FOODTIME_RELEASE_STORE_FILE').orNull
def communityPrototype = providers.gradleProperty('FOODTIME_COMMUNITY_PROTOTYPE')
// 默认地址仅作为构建默认值；release 若指向非回环 http，verifyReleaseBaseUrl 会直接失败。
def apiBaseUrl = providers.gradleProperty('FOODTIME_API_BASE_URL').getOrElse('https://bjtufoodtime.top/api/v1/')

android {
    namespace 'cn.edu.bjtu.foodtime'
    compileSdk 36

    defaultConfig {
        applicationId 'cn.edu.bjtu.foodtime'
        minSdk 26
        targetSdk 36
        versionCode 23
        versionName '2.0.0α'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl.replace('"', '\\"') + '"'
        testInstrumentationRunner providers.gradleProperty('FOODTIME_TEST_RUNNER').getOrElse('cn.edu.bjtu.foodtime.presentation.RemoteUiRunner')
    }

    signingConfigs {
        if (releaseStorePath) {
            release {
                storeFile file(releaseStorePath)
                storePassword providers.gradleProperty('FOODTIME_RELEASE_STORE_PASSWORD').get()
                keyAlias providers.gradleProperty('FOODTIME_RELEASE_KEY_ALIAS').get()
                keyPassword providers.gradleProperty('FOODTIME_RELEASE_KEY_PASSWORD').get()
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix providers.gradleProperty('FOODTIME_DEBUG_SUFFIX').getOrElse('')
            buildConfigField 'boolean', 'COMMUNITY_PROTOTYPE_ENABLED', communityPrototype.getOrElse('false')
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'COMMUNITY_PROTOTYPE_ENABLED', communityPrototype.getOrElse('false')
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets {
        test.java.srcDir 'src/testShared/java'
        androidTest.java.srcDir 'src/testShared/java'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:image:4.6.2'
    // bsdiff 补丁解压使用 bzip2；仅更新路径使用。
    implementation 'org.apache.commons:commons-compress:1.27.1'
    testImplementation 'junit:junit:4.13.2'
    // Exercise the real JSON/HTTP mapping on the JVM; not packaged in the Android app.
    testImplementation 'org.json:json:20240303'
}

def verifyArchitecture = tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Checks that source packages respect the documented dependency direction.'
    def sourceFiles = fileTree('src/main/java') { include '**/*.java' }
    inputs.files(sourceFiles)

    doLast {
        def violations = []
        sourceFiles.each { source ->
            def path = source.path.replace('\\', '/')
            def content = source.getText('UTF-8')

            if (path.contains('/domain/')) {
                [
                    'import android.',
                    'import cn.edu.bjtu.foodtime.app.',
                    'import cn.edu.bjtu.foodtime.data.',
                    'import cn.edu.bjtu.foodtime.presentation.'
                ].each { forbidden ->
                    if (content.contains(forbidden)) violations << "${source.name}: domain cannot use ${forbidden}"
                }
            }
            if (path.contains('/data/')) {
                [
                    'import cn.edu.bjtu.foodtime.app.',
                    'import cn.edu.bjtu.foodtime.presentation.'
                ].each { forbidden ->
                    if (content.contains(forbidden)) violations << "${source.name}: data cannot use ${forbidden}"
                }
            }
            if (path.contains('/presentation/')) {
                [
                    'import cn.edu.bjtu.foodtime.app.',
                    'import cn.edu.bjtu.foodtime.data.'
                ].each { forbidden ->
                    if (content.contains(forbidden)) {
                        violations << "${source.name}: presentation must depend on domain contracts, not ${forbidden}"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException('Architecture violations:\n - ' + violations.join('\n - '))
        }
    }
}

tasks.matching { it.name == 'check' || it.name == 'preBuild' }.configureEach {
    dependsOn verifyArchitecture
}

// P0 门禁：release 的 API 地址必须是 https（回环联调地址除外），否则上线即明文传输会话。
def verifyReleaseBaseUrl = tasks.register('verifyReleaseBaseUrl') {
    group = 'verification'
    description = 'Fails release builds whose API base URL is cleartext.'
    doLast {
        def uri = new URI(apiBaseUrl.endsWith('/') ? apiBaseUrl : apiBaseUrl + '/')
        def scheme = uri.scheme?.toLowerCase()
        def loopback = ['localhost', '127.0.0.1', '::1', '10.0.2.2'].contains(uri.host?.toLowerCase())
        if (scheme == null || !(scheme == 'https' || (scheme == 'http' && loopback))) {
            throw new GradleException("Release API base URL must use https, got: ${apiBaseUrl} "
                + '(override with -PFOODTIME_API_BASE_URL=https://<domain>/api/v1/ once the server serves TLS)')
        }
    }
}

tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    dependsOn verifyReleaseBaseUrl
}
