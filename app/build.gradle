plugins {
    id 'com.android.application'
}

def releaseStorePath = providers.gradleProperty('FOODTIME_RELEASE_STORE_FILE').orNull
def communityPrototype = providers.gradleProperty('FOODTIME_COMMUNITY_PROTOTYPE')

android {
    namespace 'cn.edu.bjtu.foodtime'
    compileSdk 36

    defaultConfig {
        applicationId 'cn.edu.bjtu.foodtime'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        buildConfigField 'String', 'API_BASE_URL', '"' + providers.gradleProperty('FOODTIME_API_BASE_URL').getOrElse('http://154.9.252.201/api/v1/').replace('"', '\\"') + '"'
        testInstrumentationRunner providers.gradleProperty('FOODTIME_TEST_RUNNER').getOrElse('cn.edu.bjtu.foodtime.presentation.RemoteUiRunner')
    }

    signingConfigs {
        if (releaseStorePath) {
            release {
                storeFile file(releaseStorePath)
                storePassword providers.gradleProperty('FOODTIME_RELEASE_STORE_PASSWORD').get()
                keyAlias providers.gradleProperty('FOODTIME_RELEASE_KEY_ALIAS').get()
                keyPassword providers.gradleProperty('FOODTIME_RELEASE_KEY_PASSWORD').get()
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix providers.gradleProperty('FOODTIME_DEBUG_SUFFIX').getOrElse('')
            buildConfigField 'boolean', 'COMMUNITY_PROTOTYPE_ENABLED', communityPrototype.getOrElse('false')
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'COMMUNITY_PROTOTYPE_ENABLED', communityPrototype.getOrElse('false')
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets {
        test.java.srcDir 'src/testShared/java'
        androidTest.java.srcDir 'src/testShared/java'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

def verifyArchitecture = tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Checks that source packages respect the documented dependency direction.'
    def sourceFiles = fileTree('src/main/java') { include '**/*.java' }
    inputs.files(sourceFiles)

    doLast {
        def violations = []
        sourceFiles.each { source ->
            def path = source.path.replace('\\', '/')
            def content = source.getText('UTF-8')

            if (path.contains('/domain/')) {
                [
                    'import android.',
                    'import cn.edu.bjtu.foodtime.app.',
                    'import cn.edu.bjtu.foodtime.data.',
                    'import cn.edu.bjtu.foodtime.presentation.'
                ].each { forbidden ->
                    if (content.contains(forbidden)) violations << "${source.name}: domain cannot use ${forbidden}"
                }
            }
            if (path.contains('/data/')) {
                [
                    'import cn.edu.bjtu.foodtime.app.',
                    'import cn.edu.bjtu.foodtime.presentation.'
                ].each { forbidden ->
                    if (content.contains(forbidden)) violations << "${source.name}: data cannot use ${forbidden}"
                }
            }
            if (path.contains('/presentation/')) {
                [
                    'import cn.edu.bjtu.foodtime.app.',
                    'import cn.edu.bjtu.foodtime.data.'
                ].each { forbidden ->
                    if (content.contains(forbidden)) {
                        violations << "${source.name}: presentation must depend on domain contracts, not ${forbidden}"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException('Architecture violations:\n - ' + violations.join('\n - '))
        }
    }
}

tasks.matching { it.name == 'check' || it.name == 'preBuild' }.configureEach {
    dependsOn verifyArchitecture
}
