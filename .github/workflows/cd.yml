name: Android CD

on:
  workflow_run:
    workflows: [Android CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-apk-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify release source
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.source.outputs.build }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check current main merge and release opt-out
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api() {
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$API_URL/repos/$REPOSITORY/$1"
          }
          current=$(api git/ref/heads/main | jq -r '.object.sha')
          parents=$(api "commits/$SHA" | jq '.parents | length')
          skipped=$(api "commits/$SHA/pulls?per_page=100" | jq --arg sha "$SHA" \
            '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)
              | .labels[]? | select(.name == "skip-release")] | length')
          if [[ "$current" != "$SHA" ]] || (( parents < 2 || skipped > 0 )); then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo 'Skip superseded, non-merge or explicitly excluded main commit.'
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build signed APK (publish only from main)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foodtime-release.jks"

      - name: Verify and build signed release
        env:
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_STORE_FILE: ${{ runner.temp }}/foodtime-release.jks
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew verifyArchitecture testDebugUnitTest lintRelease assembleRelease \
            --no-configuration-cache

      - name: Verify APK signature and prepare artifacts
        id: apk
        env:
          MERGE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_path"
          release_dir="$RUNNER_TEMP/foodtime-apk"
          mkdir -p "$release_dir"
          cp "$apk_path" "$release_dir/app-release.apk"
          (cd "$release_dir" && sha256sum app-release.apk > app-release.apk.sha256)
          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"
          version_name=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk_path" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foodtime-Android-release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ needs.gate.outputs.sha }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          RELEASE_VERSION: ${{ steps.apk.outputs.version }}
          RELEASE_DIRECTORY: ${{ steps.apk.outputs.directory }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$MERGE_SHA" \
              --title "Foodtime Android v${RELEASE_VERSION}" \
              --draft \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "$RELEASE_DIRECTORY/app-release.apk" \
            "$RELEASE_DIRECTORY/app-release.apk.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          echo "### Android Release APK" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize development artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
        run: |
          echo "### Signed development APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact only: no main merge and no GitHub Release was published." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/foodtime-release.jks"
