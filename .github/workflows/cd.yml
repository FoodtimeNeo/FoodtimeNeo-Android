name: Android CD

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish signed APK after merge to main
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foodtime-release.jks"

      - name: Verify and build signed release
        env:
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_STORE_FILE: ${{ runner.temp }}/foodtime-release.jks
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew verifyArchitecture testDebugUnitTest lintRelease assembleRelease \
            --no-configuration-cache

      - name: Verify APK signature and prepare artifacts
        id: apk
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_path"
          release_dir="$RUNNER_TEMP/foodtime-apk"
          mkdir -p "$release_dir"
          cp "$apk_path" "$release_dir/app-release.apk"
          (cd "$release_dir" && sha256sum app-release.apk > app-release.apk.sha256)
          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"
          echo "tag=android-main-${GITHUB_RUN_NUMBER}-${MERGE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foodtime-Android-release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          RELEASE_DIRECTORY: ${{ steps.apk.outputs.directory }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$MERGE_SHA" \
              --title "Foodtime Android #${GITHUB_RUN_NUMBER}" \
              --draft \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "$RELEASE_DIRECTORY/app-release.apk" \
            "$RELEASE_DIRECTORY/app-release.apk.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          echo "### Android Release APK" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/foodtime-release.jks"
