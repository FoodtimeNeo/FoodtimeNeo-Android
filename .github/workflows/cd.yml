name: Android CD

on:
  workflow_run:
    workflows: [Android CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-apk-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify release source
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.source.outputs.build }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check current main merge and release opt-out
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api() {
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$API_URL/repos/$REPOSITORY/$1"
          }
          current=$(api git/ref/heads/main | jq -r '.object.sha')
          parents=$(api "commits/$SHA" | jq '.parents | length')
          skipped=$(api "commits/$SHA/pulls?per_page=100" | jq --arg sha "$SHA" \
            '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)
              | .labels[]? | select(.name == "skip-release")] | length')
          if [[ "$current" != "$SHA" ]] || (( parents < 2 || skipped > 0 )); then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo 'Skip superseded, non-merge or explicitly excluded main commit.'
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build signed APK (publish only from main)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    # Pin the release environment so image upgrades cannot change delta-tool sources.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foodtime-release.jks"

      - name: Verify and build signed release
        env:
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_STORE_FILE: ${{ runner.temp }}/foodtime-release.jks
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FOODTIME_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew verifyArchitecture testDebugUnitTest lintRelease assembleRelease \
            --no-configuration-cache

      - name: Verify APK signature and prepare artifacts
        id: apk
        env:
          MERGE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_path"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_path"
          release_dir="$RUNNER_TEMP/foodtime-apk"
          mkdir -p "$release_dir"
          cp "$apk_path" "$release_dir/app-release.apk"
          (cd "$release_dir" && sha256sum app-release.apk > app-release.apk.sha256)
          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"
          version_name=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk_path" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          version_code=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk_path" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version_code" =~ ^[0-9]+$ ]]
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Build delta patches and release manifest
        id: delta
        if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          RELEASE_VERSION: ${{ steps.apk.outputs.version }}
          RELEASE_CODE: ${{ steps.apk.outputs.code }}
          RELEASE_DIRECTORY: ${{ steps.apk.outputs.directory }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          asset_base="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          apk="$RELEASE_DIRECTORY/app-release.apk"
          apk_sha=$(sha256sum "$apk" | cut -d' ' -f1)
          apk_size=$(stat -c%s "$apk")
          patches='[]'
          old_root="$RUNNER_TEMP/foodtime-old-apk"
          mkdir -p "$old_root"
          # 只对最近三个正式版本生成补丁，控制构建时间与发布体积。
          mapfile -t previous < <(gh release list --exclude-drafts --exclude-pre-releases --limit 6 \
            --json tagName --jq '.[].tagName' | grep -vxF "$RELEASE_TAG" | head -n 3)
          for tag in "${previous[@]:-}"; do
            [[ -n "$tag" ]] || continue
            mkdir -p "$old_root/$tag"
            if ! gh release download "$tag" --pattern app-release.apk --dir "$old_root/$tag" --clobber >/dev/null 2>&1; then
              echo "::warning::No APK in release $tag; skipping delta patch"
              continue
            fi
            old_apk="$old_root/$tag/app-release.apk"
            old_code=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$old_apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            [[ "$old_code" =~ ^[0-9]+$ ]] || continue
            patch="$RELEASE_DIRECTORY/app-release-${old_code}-${RELEASE_CODE}.patch"
            bsdiff "$old_apk" "$apk" "$patch"
            entry=$(jq -n --argjson base "$old_code" \
              --arg url "$asset_base/$(basename "$patch")" \
              --arg sha "$(sha256sum "$patch" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "$patch")" \
              '{baseVersionCode:$base,url:$url,sha256:$sha,size:$size}')
            patches=$(jq -n --argjson current "$patches" --argjson next "$entry" '$current + [$next]')
            echo "Generated delta patch for v$old_code"
          done
          jq -n --argjson versionCode "$RELEASE_CODE" \
            --arg versionName "$RELEASE_VERSION" \
            --arg url "$asset_base/app-release.apk" \
            --arg sha "$apk_sha" \
            --argjson size "$apk_size" \
            --argjson patches "$patches" \
            '{versionCode:$versionCode,versionName:$versionName,apk:{url:$url,sha256:$sha,size:$size},patches:$patches}' \
            > "$RELEASE_DIRECTORY/manifest.json"
          cat "$RELEASE_DIRECTORY/manifest.json"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foodtime-Android-release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ needs.gate.outputs.sha }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          RELEASE_VERSION: ${{ steps.apk.outputs.version }}
          RELEASE_DIRECTORY: ${{ steps.apk.outputs.directory }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$MERGE_SHA" \
              --title "Foodtime Android v${RELEASE_VERSION}" \
              --draft \
              --generate-notes
          fi
          files=(
            "$RELEASE_DIRECTORY/app-release.apk"
            "$RELEASE_DIRECTORY/app-release.apk.sha256"
            "$RELEASE_DIRECTORY/manifest.json"
          )
          for patch in "$RELEASE_DIRECTORY"/app-release-*-*.patch; do
            [[ -e "$patch" ]] && files+=("$patch")
          done
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          echo "### Android Release APK" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize development artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
        run: |
          echo "### Signed development APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact only: no main merge and no GitHub Release was published." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/foodtime-release.jks"
